name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 1.2.8. Leave blank for the next one. An existing version rolls main back to it."
        required: false
        default: ""
      bump:
        description: "When the version is blank, raise the last one by"
        type: choice
        options:
          - "x.x.0 -> x.x.1"
          - "x.0.0 -> x.1.0"
          - "0.0.0 -> 1.0.0"
        default: "x.x.0 -> x.x.1"
      test:
        description: "Test run: do everything except publish, and show the version and notes in the run summary"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  copilot-requests: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0

      - name: Check the code
        run: |
          python3 -m compileall -q app
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Pick the version
        id: ver
        run: |
          VERSION="${VERSION#core-}"; VERSION="${VERSION#v}"
          last="$(git tag -l 'core-v*' | sed 's/^core-v//' | sort -V | tail -1)"
          if [ -n "$VERSION" ] && git rev-parse -q --verify "refs/tags/core-v$VERSION" >/dev/null; then
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$VERSION" ]; then
              IFS=. read -r a b c <<< "${last:-1.0.0}"
              a=${a:-0}; b=${b:-0}; c=${c:-0}
              case "$BUMP" in "0.0.0"*) a=$((a+1)); b=0; c=0 ;; "x.0.0"*) b=$((b+1)); c=0 ;; *) c=$((c+1)) ;; esac
              VERSION="$a.$b.$c"
            fi
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          base=""
          if [ -n "$last" ]; then
            base="$(git log -1 --format=%B "core-v$last" | sed -n 's/^Squashed from nightly@\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)"
            [ -n "$base" ] || base="core-v$last"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Last release: ${last:-none}. This run: core-v$VERSION ($(grep mode= "$GITHUB_OUTPUT" | cut -d= -f2))"

      - name: Roll main back
        if: steps.ver.outputs.mode == 'rollback' && inputs.test != true
        run: |
          git push --force-with-lease origin "refs/tags/core-v${{ steps.ver.outputs.version }}^{commit}:refs/heads/main"
          echo "main now points at core-v${{ steps.ver.outputs.version }}"

      - name: List the changes
        if: steps.ver.outputs.mode == 'release'
        run: |
          range="${{ steps.ver.outputs.base }}"; [ -n "$range" ] && range="$range..HEAD" || range="HEAD"
          git log --no-merges --pretty='- %s' $range | head -80 > changes.txt
          [ -s changes.txt ] || echo "- No changes since the last release" > changes.txt
          cat changes.txt
          git log --no-merges --pretty=format:'--- %h%n%s%n%b' --stat=100 $range | head -c 60000 > details.txt

      - name: Write the notes with Copilot
        if: steps.ver.outputs.mode == 'release'
        id: ai
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          npm install -g --include=optional @github/copilot
          cat > prompt.txt <<EOF
          You write release notes for Printer Buddy, a web app for managing 3D printers. Below is the list of commits with the files each one changed. For every commit, read the real code change by running git show followed by the commit hash (you may also use git diff and git log) before you write about it, so you describe what the code does, not just what the message says. Only use those read-only git commands. Do not change anything.
          Reply in Markdown, no preamble, grouped under these headings, leaving out any that would be empty:
          ### New
          ### Improved
          ### Fixed
          ### Behind the scenes
          Under each, one bullet per change. Each bullet is one or two plain sentences saying what changed and what it means for someone using it. Merge related commits. No marketing language and no commit hashes. Name the actual feature, screen or setting that changed.
          The commits (hash, subject, description and files changed):
          $(cat details.txt)
          EOF
          if out="$(copilot -s -p "$(cat prompt.txt)" --allow-tool='shell(git show:*)' --allow-tool='shell(git diff:*)' --allow-tool='shell(git log:*)' 2> copilot.err)" && [ -n "$out" ]; then
            { echo "response<<NOTES_END"; echo "$out"; echo "NOTES_END"; } >> "$GITHUB_OUTPUT"
          else
            echo "Copilot failed:"; cat copilot.err; exit 1
          fi

      - name: Show the notes
        if: steps.ver.outputs.mode == 'release'
        env:
          AI_NOTES: ${{ steps.ai.outputs.response }}
        run: |
          if [ -n "$AI_NOTES" ]; then src="written by Copilot"; notes="$AI_NOTES"; else src="Copilot notes failed, using the commit list"; notes="$(cat changes.txt)"; fi
          {
            echo "### core-v${{ steps.ver.outputs.version }}${{ inputs.test && ' (test, nothing published)' || '' }}"
            echo "Notes: $src"
            echo
            echo "$notes"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.ver.outputs.mode == 'release' && inputs.test != true
        env:
          AI_NOTES: ${{ steps.ai.outputs.response }}
        run: |
          tag="core-v${{ steps.ver.outputs.version }}"
          notes="$AI_NOTES"; [ -n "$notes" ] || notes="$(cat changes.txt)"
          notes="$notes"$'\n\n'"Commit $GITHUB_SHA. Stable installs follow the main branch."
          needs="$(grep -v '^\s*#' needs.txt 2>/dev/null | grep . | paste -sd, - | sed 's/,/, /g' || true)"
          [ -n "$needs" ] && notes="$notes"$'\n\n'"needs: $needs"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main || true
          parent="$(git rev-parse -q --verify origin/main || true)"
          commit="$(git commit-tree "HEAD^{tree}" ${parent:+-p "$parent"} -m "Printer Buddy ${tag#core-}" -m "Squashed from nightly@$(git rev-parse HEAD)")"
          git push origin "$commit:refs/heads/main"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$commit" --latest=false \
            --title "Printer Buddy ${tag#core-}" --notes "$notes"

