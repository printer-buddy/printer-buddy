# Run this before "release all": lists every part's latest released version, the highest one,
# and the next flat version that no part has yet. Changes nothing.
name: current versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List versions
        run: |
          set -euo pipefail
          latest() {  # repo, tag prefix
            gh api "repos/$1/tags?per_page=100" --paginate --jq '.[].name' | grep "^$2[0-9]" | sed "s/^$2//" | sort -V | tail -1 || true
          }
          {
            echo "## Current versions"
            echo
            echo "| Part | Latest release |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          all=""
          while read -r name repo prefix; do
            v=$(latest "$repo" "$prefix")
            echo "| $name | ${v:-none} |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: ${v:-none}"
            [ -n "$v" ] && all="$all $v"
          done <<'PARTS'
          core printer-buddy/printer-buddy core-v
          ui printer-buddy/print-buddy-ui v
          timelapse printer-buddy/print-buddy-timelapse v
          notify printer-buddy/print-buddy-notify v
          streamer printer-buddy/print-buddy-streamer v
          soloai printer-buddy/solo-print-buddy-ai v
          PARTS
          high=$(printf '%s\n' $all | sort -V | tail -1)
          IFS=. read -r a b c <<< "${high:-0.0.0}"
          next="${a:-0}.${b:-0}.$(( ${c:-0} + 1 ))"
          {
            echo
            echo "**Current highest:** ${high:-none}"
            echo
            echo "**Next flat version** (higher than every part, so none are skipped): $next"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Current highest: ${high:-none}  Next flat version: $next"
